name: release

# Tag push v*  : test, build the zip, upload it to CurseForge.
# Manual run   : the same, but NOTHING is uploaded to CurseForge (dry run). The zip is kept as a workflow artifact.
# Needs (for the upload only): secret CF_API_KEY. The CurseForge project id is a constant in tools/release.py.
# The token is never printed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lua tests (LuaJIT)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libluajit-5.1-2
          python3 -I tools/lua.py all

      - name: Release tool tests
        run: python3 -I -m unittest discover -s tests -p test_release.py -v

      - name: Check tag, toc and changelog
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            python3 -I tools/release.py check --tag "$TAG"
          else
            python3 -I tools/release.py check
          fi

      - name: Build the zip (stage.py, then check against stage/MANIFEST.md5)
        run: python3 -I tools/release.py build --out dist

      # Read only: looks up the CurseForge game version by name. The token is used for GET calls here.
      - name: CurseForge game version (read only)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 -I tools/release.py versions --skip-if-no-token

      - name: Show what an upload would send (no upload)
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python3 -I tools/release.py upload --dry-run --zip "$(ls dist/Spoken_Wind-*.zip)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Spoken_Wind-zip
          path: dist/Spoken_Wind-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Spoken_Wind-zip
          path: dist

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: python3 -I tools/release.py upload --zip "dist/Spoken_Wind-${TAG#v}.zip" --tag "$TAG"
